<!DOCTYPE html>
<html>
<head>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#000000">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body { margin:0; font-family:sans-serif; background:#000; color:#fff; }
#controls { padding:10px; background:#111; color;#fff; }
#wrapper { overflow-x:auto; }
#keyboard { display:flex; }

.key {
  width:60px;
  height:140px;
  border:1px solid #333;
  margin:2px;
  touch-action:none;
  transition: all 0.08s;
}

.key.active {
  transform: scale(0.95);
  filter: brightness(1.8);
  box-shadow: 0 0 20px rgba(255,255,255,0.9);
}

.harmRow {
  display:flex;
  align-items:center;
  gap:5px;
}
</style>
</head>
<body>

<div id="controls">

分割数 <input id="divisions" type="number" value="12">
オクターブ数 <input id="octaves" type="number" value="2">
基準Hz <input id="baseFreq" type="number" value="440"><br>

Attack <input id="attack" type="range" min="0" max="1" step="0.01" value="0.05">
Release <input id="release" type="range" min="0" max="2" step="0.01" value="0.3"><br>

LFO速さ <input id="lfoRate" type="range" min="0" max="20" step="0.1" value="5">
LFO強さ <input id="lfoDepth" type="range" min="0" max="100" value="20"><br>

倍音モード
<select id="harmMode">
  <option value="absolute">絶対</option>
  <option value="relative">比率</option>
</select>

<h4>倍音</h4>

<div id="harmonics">

<div class="harmRow">1
<input class="harm" data-n="1" type="range" min="0" max="1" step="0.01" value="1">
<input class="harmNum" type="number" min="0" max="1" step="0.01" value="1">
</div>

<div class="harmRow">2
<input class="harm" data-n="2" type="range" min="0" max="1" step="0.01" value="0">
<input class="harmNum" type="number" min="0" max="1" step="0.01" value="0">
</div>

<div class="harmRow">3
<input class="harm" data-n="3" type="range" min="0" max="1" step="0.01" value="0">
<input class="harmNum" type="number" min="0" max="1" step="0.01" value="0">
</div>

<div class="harmRow">4
<input class="harm" data-n="4" type="range" min="0" max="1" step="0.01" value="0">
<input class="harmNum" type="number" min="0" max="1" step="0.01" value="0">
</div>

<div class="harmRow">5
<input class="harm" data-n="5" type="range" min="0" max="1" step="0.01" value="0">
<input class="harmNum" type="number" min="0" max="1" step="0.01" value="0">
</div>

<div class="harmRow">6
<input class="harm" data-n="6" type="range" min="0" max="1" step="0.01" value="0">
<input class="harmNum" type="number" min="0" max="1" step="0.01" value="0">
</div>

<div class="harmRow">7
<input class="harm" data-n="7" type="range" min="0" max="1" step="0.01" value="0">
<input class="harmNum" type="number" min="0" max="1" step="0.01" value="0">
</div>

<div class="harmRow">8
<input class="harm" data-n="8" type="range" min="0" max="1" step="0.01" value="0">
<input class="harmNum" type="number" min="0" max="1" step="0.01" value="0">
</div>

</div>

<br>

<input id="presetName" placeholder="名前">
<button onclick="savePreset()">保存</button>
<select id="presetList"></select>
<button onclick="loadPreset()">読み込み</button>

<br><br>
<button onclick="buildKeyboard()">鍵盤再生成</button>

</div>

<div id="wrapper">
<div id="keyboard"></div>
</div>

<script>
let audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let activeTouches = {};
let activeNotes = new Set();
// ===== 倍音同期 =====
document.querySelectorAll(".harmRow").forEach(row=>{
  const slider = row.querySelector(".harm");
  const num = row.querySelector(".harmNum");

  slider.oninput = ()=> num.value = slider.value;
  num.oninput = ()=> slider.value = num.value;
});

// ===== 色 =====
function getColor(n,N){
  return `hsl(${(n%N)*(360/N)},70%,60%)`;
}

// ===== 鍵盤 =====
function buildKeyboard(){
  const kb=document.getElementById("keyboard");
  kb.innerHTML="";

  const N=+divisions.value;
  const base=+baseFreq.value;
  const oct=+octaves.value;

  for(let o=0;o<oct;o++){
    for(let i=0;i<N;i++){
      const freq=base*Math.pow(2,(i+o*N)/N);

      const key=document.createElement("div"); // ← 先に作る

      const note = 69 + (i + o * N);

      key.dataset.note = note;   // ← そのあと
      key.dataset.freq = freq;

      key.className="key";
      key.style.background=getColor(i,N);

      key.addEventListener("touchstart",(e)=>startSound(e,key,freq));
      key.addEventListener("touchmove",moveSound);
      key.addEventListener("touchend",stopSound);

      kb.appendChild(key);
    }
  }
}

// ===== 音量 =====
function getVolume(t,key){
  const r=key.getBoundingClientRect();
  return Math.max(0,1-(t.clientY-r.top)/r.height);
}

// ===== 音生成 =====
function createSound(freq,vol){
  const mainGain=audioCtx.createGain();
  mainGain.gain.value=vol;

  const harms=document.querySelectorAll(".harm");
  const mode=harmMode.value;

  let baseLevel=+document.querySelector('[data-n="1"]').value;
  let total=0;
  harms.forEach(h=>total+=+h.value);

  let oscs=[];

  harms.forEach(h=>{
    let n=+h.dataset.n;
    let level=+h.value;
    if(level<=0)return;

    if(mode==="relative") level=baseLevel*level;
    if(total>0) level/=total;

    const osc=audioCtx.createOscillator();
    const g=audioCtx.createGain();

    osc.frequency.value=freq*n;
    g.gain.value=level;

    osc.connect(g);
    g.connect(mainGain);

    osc.start();
    oscs.push(osc);
  });

  const lfo=audioCtx.createOscillator();
  const lfoGain=audioCtx.createGain();

  lfo.frequency.value=lfoRate.value;
  lfoGain.gain.value=lfoDepth.value;

  lfo.connect(lfoGain);
  if(oscs[0]) lfoGain.connect(oscs[0].frequency);

  lfo.start();

  mainGain.connect(audioCtx.destination);

  return {oscs,mainGain,lfo};
}

// ===== 発音 =====
function startSound(e,key,freq){
  e.preventDefault();

  for(let t of e.changedTouches){
    key.classList.add("active");

    const vol=getVolume(t,key);
    const atk=+attack.value;

    const s=createSound(freq,0);
    s.mainGain.gain.linearRampToValueAtTime(vol,audioCtx.currentTime+atk);

    activeTouches[t.identifier]={...s,key};
  }
}

// ===== 移動 =====
function moveSound(e){
  for(let t of e.touches){
    const obj=activeTouches[t.identifier];
    if(!obj)continue;
    obj.mainGain.gain.value=getVolume(t,obj.key);
  }
}

// ===== 停止 =====
function stopSound(e){
  for(let t of e.changedTouches){
    const obj=activeTouches[t.identifier];
    if(!obj)continue;

    const rel=+release.value;

    obj.mainGain.gain.linearRampToValueAtTime(0,audioCtx.currentTime+rel);
    obj.oscs.forEach(o=>o.stop(audioCtx.currentTime+rel));
    obj.lfo.stop(audioCtx.currentTime+rel);

    obj.key.classList.remove("active");

    delete activeTouches[t.identifier];
  }
}

function midiNoteOn(note, velocity){
  if(activeNotes.has(note)) return;
  activeNotes.add(note);

  const key = document.querySelector(`[data-note="${note}"]`);
  if(!key) return;

  key.classList.add("active");

  const freq = parseFloat(key.dataset.freq);
  const vol = velocity / 127;

  const atk = +attack.value;

  const s = createSound(freq, 0);
  s.mainGain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + atk);

  activeTouches["midi_"+note] = { ...s, key };
}

function midiNoteOff(note){
  activeNotes.delete(note);

  const obj = activeTouches["midi_"+note];
  if(!obj) return;

  const rel = +release.value;

  obj.mainGain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + rel);
  obj.oscs.forEach(o => o.stop(audioCtx.currentTime + rel));
  obj.lfo.stop(audioCtx.currentTime + rel);

  obj.key.classList.remove("active");

  delete activeTouches["midi_"+note];
}

// ===== プリセット =====
function savePreset(){
  const name=presetName.value;
  if(!name)return;

  const data={
    divisions,baseFreq,attack,release,lfoRate,lfoDepth,harmMode,
    harms:[...document.querySelectorAll(".harm")].map(h=>h.value)
  };

  localStorage.setItem("preset_"+name,JSON.stringify(data));
  updatePresetList();
}

function loadPreset(){
  const name=presetList.value;
  const data=JSON.parse(localStorage.getItem("preset_"+name));

  divisions.value=data.divisions.value;
  baseFreq.value=data.baseFreq.value;
  attack.value=data.attack.value;
  release.value=data.release.value;
  lfoRate.value=data.lfoRate.value;
  lfoDepth.value=data.lfoDepth.value;
  harmMode.value=data.harmMode.value;

  document.querySelectorAll(".harm").forEach((h,i)=>h.value=data.harms[i]);

  buildKeyboard();
}

function updatePresetList(){
  presetList.innerHTML="";
  for(let k in localStorage){
    if(k.startsWith("preset_")){
      let opt=document.createElement("option");
      opt.value=k.replace("preset_","");
      opt.textContent=opt.value;
      presetList.appendChild(opt);
    }
  }
}

buildKeyboard();
updatePresetList();
if (navigator.requestMIDIAccess) {
  navigator.requestMIDIAccess().then(midiAccess => {
    for (let input of midiAccess.inputs.values()) {
      input.onmidimessage = (msg) => {
        const [status, note, velocity] = msg.data;

        if (status === 0x90 && velocity > 0) {
          midiNoteOn(note, velocity);
        } else if (status === 0x80 || (status === 0x90 && velocity === 0)) {
          midiNoteOff(note);
        }
      };
    }
  });
}
</script>

</body>
</html>
